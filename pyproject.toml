[project]
name = "collatz-exp"
version = "0.1.0"
description = "Experimental exact-arithmetic certificate search for accelerated Collatz descent"
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.14.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["numpy>=1.26", "scipy>=1.11", "sympy>=1.12"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
